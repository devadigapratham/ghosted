<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; padding: 12px; width: 240px;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    button {
      display: block; width: 100%; margin-bottom: 8px; padding: 8px 12px;
      border-radius: 6px; border: 1px solid #8884; background: transparent;
      color: inherit; cursor: pointer; font-size: 13px; text-align: left;
    }
    button.primary { background: #1b7f4d; border-color: #1b7f4d; color: #fff; font-weight: 600; }
    button:hover { filter: brightness(1.1); }
    .queue { font-size: 12px; opacity: .75; margin: 4px 0 10px; }
    .queue.has { color: #b07d00; opacity: 1; }
  </style>
</head>
<body>
  <button id="logBtn" class="primary">＋ Log this job</button>
  <div id="queueInfo" class="queue">Queue: 0 pending</div>
  <button id="retryBtn" hidden>↻ Retry queued rows now</button>
  <button id="optionsBtn">⚙ Options</button>
  <script src="popup.js"></script>
</body>
</html>
